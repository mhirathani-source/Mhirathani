openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Club membership and finance management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: club
    description: Club dashboard
  - name: members
    description: Member records
  - name: plans
    description: Membership plans
  - name: subscriptions
    description: Subscriptions and payment history
  - name: finance
    description: Finance, cash, payroll, and reporting operations
paths:
  /club/overview:
    get:
      operationId: getClubOverview
      summary: Non-financial operational overview for club staff
      responses:
        "200":
          description: Counts only; no financial data
          content:
            application/json:
              schema:
                type: object
                required: [activeMembers, endingSoon, expiredSubscriptions]
                properties:
                  activeMembers: { type: integer }
                  endingSoon: { type: integer }
                  expiredSubscriptions: { type: integer }
  /members/{id}/profile:
    get:
      operationId: getMemberProfile
      summary: Basic member profile without subscriptions or financial history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Basic member data only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "404":
          description: Member not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /club/session:
    get:
      operationId: getClubSession
      tags: [club]
      summary: Get current club user and access status
      responses:
        "200":
          description: Current session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubSession"
        "401":
          description: Not signed in
  /club/dashboard:
    get:
      operationId: getClubDashboard
      tags: [club]
      summary: Get operational and financial dashboard
      responses:
        "200":
          description: Dashboard totals and upcoming renewals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDashboard"
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: Search and list members
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Matching members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
    post:
      operationId: createMember
      tags: [members]
      summary: Add a member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInput" }
      responses:
        "201":
          description: Member created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
  /members/{id}:
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Permanently delete an unlinked member (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Member deleted without deleting any historical records
        "409":
          description: Linked records exist; archive the member instead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberDeleteConflict" }
        "403":
          description: Admin role required
    get:
      operationId: getMember
      tags: [members]
      summary: Get member profile, subscription history, and payments
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Member profile and history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberDetail" }
        "404":
          description: Member not found
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Member updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List membership plans
      responses:
        "200":
          description: Membership plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plan" }
    post:
      operationId: createPlan
      tags: [plans]
      summary: Create a membership plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
  /plans/{id}:
    patch:
      operationId: updatePlan
      tags: [plans]
      summary: Update a membership plan
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanUpdate" }
      responses:
        "200":
          description: Plan updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List subscriptions
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, paused, expired, cancelled, all]
            default: all
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subscription" }
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Start a subscription for a member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionInput" }
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
  /subscriptions/{id}:
    patch:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Correct a current subscription without changing its payments (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionUpdate" }
      responses:
        "200":
          description: Current subscription updated and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "409":
          description: Historical subscription, duplicate period, or price below paid amount
  /subscriptions/{id}/action:
    post:
      operationId: actOnSubscription
      tags: [subscriptions]
      summary: Pause, resume, renew, or cancel a subscription
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionAction" }
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
  /subscriptions/{id}/payments:
    get:
      operationId: listSubscriptionPayments
      tags: [subscriptions]
      summary: List payments and adjustments for a subscription
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Subscription payment history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }
    post:
      operationId: createSubscriptionPayment
      tags: [subscriptions]
      summary: Record a partial or full payment
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
  /payments/{id}/receipt:
    get:
      operationId: getPaymentReceipt
      tags: [subscriptions]
      summary: Get a printable receipt
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Receipt data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "404":
          description: Payment not found
  /club/finance/categories:
    get:
      operationId: listFinanceCategories
      tags: [club]
      summary: List finance categories
      responses:
        "200":
          description: Finance categories
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FinanceCategory" } }
    post:
      operationId: createFinanceCategory
      tags: [club]
      summary: Create finance category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceCategoryInput" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceCategory" }
  /club/finance/transactions:
    get:
      operationId: listFinanceTransactions
      tags: [club]
      summary: List finance transactions
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Transactions in the requested period
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FinanceTransaction" } }
    post:
      operationId: createFinanceTransaction
      tags: [club]
      summary: Record income or expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceTransactionInput" }
      responses:
        "201":
          description: Transaction recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceTransaction" }
  /club/finance/report:
    get:
      operationId: getFinanceReport
      tags: [club]
      summary: Calculate financial totals and outstanding balances
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Financial report for the selected dates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceReport" }
  /club/cash-movements:
    get:
      operationId: listCashMovements
      tags: [club]
      summary: List cash register movements
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Cash register movements
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CashMovement" } }
  /club/employees:
    get:
      operationId: listEmployees
      tags: [club]
      summary: List employees
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Employee" } }
    post:
      operationId: createEmployee
      tags: [club]
      summary: Add employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
  /club/payroll:
    get:
      operationId: listPayroll
      tags: [club]
      summary: List payroll entries
      responses:
        "200":
          description: Payroll entries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PayrollEntry" } }
    post:
      operationId: createPayroll
      tags: [club]
      summary: Create a monthly payroll entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayrollInput" }
      responses:
        "201":
          description: Payroll entry created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollEntry" }
  /club/payroll/{id}/pay:
    post:
      operationId: payPayroll
      tags: [club]
      summary: Record a payroll payment
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayrollPaymentInput" }
      responses:
        "200":
          description: Updated payroll balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollEntry" }
  /finance/categories:
    get:
      operationId: listFinanceCategoriesV2
      tags: [finance]
      summary: List finance categories
      responses:
        "200":
          description: Finance categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FinanceCategory" }
    post:
      operationId: createFinanceCategoryV2
      tags: [finance]
      summary: Add a finance category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceCategoryInput" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceCategory" }
  /finance/categories/{id}:
    patch:
      operationId: updateFinanceCategory
      tags: [finance]
      summary: Rename or deactivate a finance category
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceCategoryUpdate" }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceCategory" }
        "404":
          description: Category not found
  /finance/transactions:
    get:
      operationId: listFinanceTransactionsV2
      tags: [finance]
      summary: List income and expense transactions
      parameters:
        - in: query
          name: startDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          schema: { type: string, format: date }
        - in: query
          name: kind
          schema: { type: string, enum: [income, expense] }
      responses:
        "200":
          description: Matching transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManagedFinanceTransaction" }
    post:
      operationId: createFinanceTransactionV2
      tags: [finance]
      summary: Record income or an expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedFinanceTransactionInput" }
      responses:
        "201":
          description: Transaction recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedFinanceTransaction" }
  /finance/transactions/{id}:
    patch:
      operationId: updateFinanceTransaction
      tags: [finance]
      summary: Edit a finance transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceTransactionUpdate" }
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedFinanceTransaction" }
        "404":
          description: Transaction not found
  /finance/employees:
    get:
      operationId: listEmployeesV2
      tags: [finance]
      summary: List employees and payroll balances
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManagedEmployee" }
    post:
      operationId: createEmployeeV2
      tags: [finance]
      summary: Add an employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedEmployee" }
  /finance/employees/{id}:
    patch:
      operationId: updateEmployee
      tags: [finance]
      summary: Edit employee information or deactivate
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeUpdate" }
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedEmployee" }
        "404":
          description: Employee not found
  /finance/payroll:
    get:
      operationId: listPayrollV2
      tags: [finance]
      summary: List salary obligations
      responses:
        "200":
          description: Payroll entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManagedPayrollEntry" }
    post:
      operationId: createPayrollV2
      tags: [finance]
      summary: Create a salary obligation for an employee and period
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedPayrollInput" }
      responses:
        "201":
          description: Salary obligation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedPayrollEntry" }
  /finance/payroll/{id}/payments:
    post:
      operationId: recordPayrollPayment
      tags: [finance]
      summary: Record a partial or full salary payment
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayrollPaymentInput" }
      responses:
        "201":
          description: Salary payment recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedPayrollEntry" }
        "409":
          description: Payment exceeds remaining salary
  /finance/reports:
    get:
      operationId: getFinancePeriodReport
      tags: [finance]
      summary: Get a balanced daily, monthly, or yearly financial report
      parameters:
        - in: query
          name: period
          required: true
          schema: { type: string, enum: [day, month, year] }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Financial totals, category summaries, salary obligations, and cash balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancePeriodReport" }
  /finance/cash:
    get:
      operationId: getCashRegister
      tags: [finance]
      summary: Get cash balance and itemized cash movements
      responses:
        "200":
          description: Cash register
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashRegister" }
    post:
      operationId: recordCashMovement
      tags: [finance]
      summary: Record a cash deposit or withdrawal adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashMovementInput" }
      responses:
        "201":
          description: Cash movement recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterCashMovement" }
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ClubSession:
      type: object
      required: [userId, email, role, setupRequired]
      properties:
        userId: { type: string }
        email: { type: string }
        role: { type: [string, "null"], enum: [admin, staff, null] }
        setupRequired: { type: boolean }
    ClubDashboard:
      type: object
      required: [activeMembers, endingSoon, expiredSubscriptions, collectedFils, outstandingFils, monthlyCollectedFils, recentMembers]
      properties:
        activeMembers: { type: integer }
        endingSoon: { type: integer }
        expiredSubscriptions: { type: integer }
        collectedFils: { type: integer }
        outstandingFils: { type: integer }
        monthlyCollectedFils: { type: integer }
        recentMembers:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    Member:
      type: object
      required: [id, name, phone, joinedAt, active]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: [string, "null"] }
        # Calendar strings must not be coerced into timestamps by the server generator.
        birthDate: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        notes: { type: [string, "null"] }
        joinedAt: { type: string, format: date-time }
        active: { type: boolean }
    MemberInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, minLength: 7, maxLength: 24 }
        email: { type: [string, "null"], format: email }
        birthDate: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        notes: { type: [string, "null"], maxLength: 1000 }
    MemberUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, minLength: 7, maxLength: 24 }
        email: { type: [string, "null"], format: email }
        birthDate: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        notes: { type: [string, "null"], maxLength: 1000 }
        active: { type: boolean }
    MemberDeleteConflict:
      type: object
      required: [error, canArchive]
      properties:
        error: { type: string }
        canArchive: { type: boolean }
    MemberDetail:
      type: object
      required: [member, subscriptions, payments]
      properties:
        member: { $ref: "#/components/schemas/Member" }
        subscriptions:
          type: array
          items: { $ref: "#/components/schemas/Subscription" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
    Plan:
      type: object
      required: [id, name, durationDays, priceFils, active]
      properties:
        id: { type: integer }
        name: { type: string }
        durationDays: { type: integer }
        priceFils: { type: integer }
        active: { type: boolean }
    PlanInput:
      type: object
      required: [name, durationDays, priceFils]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        durationDays: { type: integer, minimum: 1, maximum: 3650 }
        priceFils: { type: integer, minimum: 0 }
    PlanUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        durationDays: { type: integer, minimum: 1, maximum: 3650 }
        priceFils: { type: integer, minimum: 0 }
        active: { type: boolean }
    Subscription:
      type: object
      required: [id, memberId, memberName, planId, planName, priceFils, discountFils, paidFils, balanceFils, startDate, endDate, status, createdAt]
      properties:
        id: { type: integer }
        memberId: { type: integer }
        memberName: { type: string }
        planId: { type: integer }
        planName: { type: string }
        priceFils: { type: integer }
        discountFils: { type: integer }
        renewedFromId: { type: [integer, "null"] }
        paidFils: { type: integer }
        balanceFils: { type: integer }
        startDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        endDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        status: { type: string, enum: [active, paused, expired, cancelled] }
        createdAt: { type: string, format: date-time }
    SubscriptionInput:
      type: object
      required: [memberId, planId, startDate]
      properties:
        memberId: { type: integer, minimum: 1 }
        planId: { type: integer, minimum: 1 }
        startDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        discountFils: { type: integer, minimum: 0, default: 0 }
        initialPaymentFils: { type: integer, minimum: 0, default: 0 }
        paymentMethod:
