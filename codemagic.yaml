workflows:
  prime_boxing_android_release:
    name: Prime Boxing Academy Android Release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - prime_boxing_mobile
      android_signing:
        - prime_boxing_android
      vars:
        EXPO_PUBLIC_DOMAIN: prime1academy.replit.app
      node: 22
      java: 17
    scripts:
      - name: Activate the workspace pnpm version
        script: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install locked workspace dependencies
        script: pnpm install --frozen-lockfile
      - name: Generate Android project and build signed APK
        script: |
          set -euo pipefail
          if [ -z "${CLERK_PUBLISHABLE_KEY:-}" ]; then
            echo "Missing CLERK_PUBLISHABLE_KEY in the Codemagic prime_boxing_mobile variable group."
            exit 1
          fi
          export EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY"
          export EXPO_PUBLIC_CLERK_PROXY_URL=""
          cd artifacts/prime-boxing-native
          pnpm exec expo prebuild --platform android --non-interactive --no-install
          cd android
          ./gradlew --no-daemon -I ../../../scripts/codemagic-signing.init.gradle assembleRelease
    artifacts:
      - artifacts/prime-boxing-native/android/app/build/outputs/apk/release/*.apk
