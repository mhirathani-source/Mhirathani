services:
  - type: web
    name: prime-boxing-academy-staging
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && PORT=10000 BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/club-manager run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/db run migrate && pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_STAGING
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: prime-boxing-academy-staging-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLUB_ADMIN_EMAIL
        sync: false
      - key: SESSION_SECRET
        sync: false

databases:
  - name: prime-boxing-academy-staging-db
    databaseName: prime_boxing_staging
    user: prime_boxing_staging
    plan: free
