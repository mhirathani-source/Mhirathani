gradle.allprojects { project ->
    project.plugins.withId("com.android.application") {
        project.afterEvaluate {
            def required = [
                "CM_KEYSTORE_PATH",
                "CM_KEYSTORE_PASSWORD",
                "CM_KEY_ALIAS",
                "CM_KEY_PASSWORD"
            ]
            def missing = required.findAll { name -> !System.getenv(name) }
            if (!missing.isEmpty()) {
                throw new GradleException(
                    "Configure Android signing in Codemagic; missing environment variables: " +
                    missing.join(", ")
                )
            }

            def android = project.extensions.findByName("android")
            if (android == null) {
                throw new GradleException("Android application extension was not found.")
            }

            def releaseSigning = android.signingConfigs.findByName("primeBoxingRelease")
            if (releaseSigning == null) {
                releaseSigning = android.signingConfigs.create("primeBoxingRelease")
            }
            releaseSigning.storeFile = new File(System.getenv("CM_KEYSTORE_PATH"))
            releaseSigning.storePassword = System.getenv("CM_KEYSTORE_PASSWORD")
            releaseSigning.keyAlias = System.getenv("CM_KEY_ALIAS")
            releaseSigning.keyPassword = System.getenv("CM_KEY_PASSWORD")

            def releaseBuild = android.buildTypes.findByName("release")
            if (releaseBuild == null) {
                throw new GradleException("Android release build type was not found.")
            }
            releaseBuild.signingConfig = releaseSigning
        }
    }
}
