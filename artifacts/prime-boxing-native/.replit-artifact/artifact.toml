kind = "mobile"
previewPath = "/prime-boxing-native/"
title = "Prime Boxing Academy Native"
description = "تطبيق Android أصلي لأكاديمية Prime Boxing، بواجهة عربية لإدارة المشتركين والاشتراكات والعمليات المالية عبر واجهات API الحالية مع تسجيل الدخول والصلاحيات المعتمدة."
version = "1.0.0"
id = "artifacts/prime-boxing-native"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/prime-boxing-native/" ]
localPort = 21361

[services.development]
run = "pnpm --filter @workspace/prime-boxing-native run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prime-boxing-native", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/prime-boxing-native", "run", "serve" ]

[services.env]
PORT = "21361"
BASE_PATH = "/prime-boxing-native/"
