kind = "web"
previewPath = "/iraq-alameer-club/"
title = "Iraq Alameer Club Manager"
description = "نظام إدارة مستقل لنادي عراق الأمير للّاعبين والاشتراكات والحضور والموظفين والمالية والتقارير، مع PostgreSQL مستقل وهوية النادي العربية."
version = "1.0.0"
id = "artifacts/iraq-alameer-club"
router = "path"

[[services]]
name = "web"
paths = [ "/iraq-alameer-club/" ]
localPort = 21228

[services.development]
run = "pnpm --filter @workspace/iraq-alameer-club run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/iraq-alameer-club", "run", "build" ]
serve = "static"
publicDir = "artifacts/iraq-alameer-club/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21228"
BASE_PATH = "/iraq-alameer-club/"
